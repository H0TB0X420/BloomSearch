# =============================================================================
# Volumes - Persistent data
# =============================================================================
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local
  rocksdb_data:
    driver: local
  crawler_state:
    driver: local
  ai_models:
    driver: local

# =============================================================================
# Network
# =============================================================================
networks:
  search_net:
    driver: bridge