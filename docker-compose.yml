services:
  # ===========================================================================
  # Database - Metadata and coordination
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: search_postgres
    environment:
      POSTGRES_DB: searchengine
      POSTGRES_USER: searchuser
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - search_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U searchuser -d searchengine"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Object Storage - Raw HTML and archives
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: search_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - search_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================================================
  # MinIO Init - Auto-create bucket with public access
  # ===========================================================================
  minio-init:
    image: minio/mc:latest
    container_name: search_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/bloom-content --ignore-existing;
      mc anonymous set public myminio/bloom-content;
      echo 'MinIO bucket bloom-content created with public access';
      exit 0;
      "
    networks:
      - search_net

  # ===========================================================================
  # Cache - Query results
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: search_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - search_net
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ===========================================================================
  # Development Container - For building and testing
  # ===========================================================================
  dev:
    build:
      context: .
      target: development
      dockerfile: Dockerfile
    container_name: search_dev
    volumes:
      - ./src:/app/src
      - ./include:/app/include
      - ./tests:/app/tests
      - ./sql:/app/sql
      - ./CMakeLists.txt:/app/CMakeLists.txt
      - ./build:/app/build
      - rocksdb_data:/data/rocksdb
    working_dir: /app
    environment:
      # PostgreSQL connection
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: searchengine
      POSTGRES_USER: searchuser
      POSTGRES_PASSWORD: dev_password
      # Convenience connection string
      POSTGRES_CONNECTION: "host=postgres port=5432 dbname=searchengine user=searchuser password=dev_password"
      # MinIO/S3
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: bloom-content
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # RocksDB
      ROCKSDB_PATH: /data/rocksdb
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - search_net
    stdin_open: true
    tty: true
    command: tail -f /dev/null

