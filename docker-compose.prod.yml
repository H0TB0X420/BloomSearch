
services:
  # ===========================================================================
  # Crawler - Production deployment
  # ===========================================================================
  crawler:
    image: ${REGISTRY}/search-crawler:${VERSION:-latest}
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    command: ./crawler
    volumes:
      - crawler_state:/data/state:rw
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: require
      MINIO_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY}
      CRAWL_RATE_LIMIT: ${CRAWL_RATE_LIMIT:-2}
      MAX_DEPTH: ${MAX_DEPTH:-3}
      USER_AGENT: "AIDetectorBot/1.0 (+https://yoursite.com/bot)"
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # ===========================================================================
  # Indexer - Production deployment
  # ===========================================================================
  indexer:
    image: ${REGISTRY}/search-indexer:${VERSION:-latest}
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    command: ./indexer
    volumes:
      - ${ROCKSDB_VOLUME_PATH}:/data/rocksdb:rw
      - ${AI_MODELS_PATH}:/data/models:ro
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: require
      MINIO_ENDPOINT: ${S3_ENDPOINT}
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY}
      ROCKSDB_PATH: /data/rocksdb
      AI_MODEL_PATH: /data/models
      BATCH_SIZE: ${BATCH_SIZE:-100}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # ===========================================================================
  # Query Engine - Production deployment
  # ===========================================================================
  query_engine:
    image: ${REGISTRY}/search-query:${VERSION:-latest}
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    command: ./query_engine
    ports:
      - "${QUERY_PORT:-80}:8080"
    volumes:
      - ${ROCKSDB_VOLUME_PATH}:/data/rocksdb:ro
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_SSLMODE: require
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ROCKSDB_PATH: /data/rocksdb
      QUERY_CACHE_TTL: ${CACHE_TTL:-3600}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  crawler_state:
    driver: local
