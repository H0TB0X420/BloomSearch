# BloomSearch — Synthetic NL→ParsedQuery eval set (Surface 1)
#
# Hand-authored gold-standard expectations for the LLM query processor.
# See evals/synthetic_schema.md for field semantics, comparison rules, and
# tolerances. The eval harness applies BloomSearch's TextProcessor (lowercase
# → stop-word strip → stem) to BOTH classic-parser output and LLM output
# before comparison, so `expected.terms` are authored as unstemmed lowercase
# tokens with stop words already removed.
#
# Categories (target counts):
#   easy_nl              10  — natural language with implicit filters
#   phrase_extraction     5  — quoted phrases must round-trip
#   implicit_ai_score     5  — "human-written"/"authentic"/"AI-generated"
#   site_tempting         5  — mentions "site"/"website" but no site_filter
#   adversarial           5  — prompt injection / schema breakouts
#   regression            5  — cases the classic parser already handles
#   edge_case             5  — empty, single word, all-caps, non-English, emoji
#   compound              5  — multiple filters in one query
#   question              5  — question-shaped, target for answer generation
#
# Field semantics:
#   id                — stable identifier (synth-NNN)
#   category          — one of the categories above
#   intent            — keyword | natural | question (cross-fed to Surface 2)
#   query             — input string (verbatim)
#   expected.terms          — list of unstemmed lowercase tokens, no stop words
#   expected.phrases        — list of exact lowercase phrases
#   expected.excluded_terms — list of unstemmed lowercase exclusions
#   expected.era_filter     — pre-ai | transition | ai-era | null
#   expected.max_ai_score   — float in [0,1] or null  (compared with ±0.2 tol)
#   expected.min_ai_score   — float in [0,1] or null  (compared with ±0.2 tol)
#   expected.site_filter    — lowercase string or null
#   notes                   — rationale; what makes this entry interesting

